; 万物之城 板端 SDK（HCP/1）
; 目标板：嘉立创 ESP32-S3 功能板 TFT 版（ESP32-S3-WROOM-1-N16R8）
; 说明：本工程只编译 SDK 本身，用于确认依赖可用；
;      学生作业请把 examples/ 下的 .ino 作为 sketch，并把 src/、include/ 一同放入。
[platformio]
src_dir = src
include_dir = include

[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_size = 16MB
board_build.psram_type = opi
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  links2004/WebSockets@^2.4.1
  bblanchon/ArduinoJson@^7.2.0
  adafruit/Adafruit NeoPixel@^1.12.0
  lovyan03/LovyanGFX@^1.1.16
